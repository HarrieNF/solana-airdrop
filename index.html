<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Solana Airdrop — Enter Token Contract</title>
<meta name="description" content="Enter any Solana token contract address to launch a dynamically branded airdrop landing page." />
<meta name="theme-color" content="#0b0b10" />
<!-- OG tags are rewritten by functions/_middleware.js at request time so
     URLs always match the current host — no hardcoded domain. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Solana Airdrop" />
<meta property="og:description" content="Enter any Solana token contract address to launch a dynamically branded airdrop landing page." />
<meta property="og:url" content="/" />
<meta property="og:image" id="og-image" content="" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Solana Airdrop" />
<meta name="twitter:description" content="Enter any Solana token contract address to launch a dynamically branded airdrop landing page." />
<meta name="twitter:image" id="tw-image" content="" />
<link rel="canonical" href="/" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23f3ba2f'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="gate-body">
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<main class="gate-wrap">
  <div class="gate-card glass">
    <div class="gate-logo" aria-hidden="true">
      <span class="ring"></span><span class="ring r2"></span><span class="dot"></span>
    </div>
    <h1>Launch your Solana airdrop</h1>
    <p class="gate-sub">Paste any Solana token contract address. The page rebrands itself automatically — logo, colors, favicon, everything.</p>

    <form id="ca-form" class="ca-form" autocomplete="off">
      <input id="ca-input" name="ca" type="text" spellcheck="false" placeholder="Enter Solana Token Contract Address" aria-label="Solana token contract address" />
      <div class="ca-actions">
        <button type="button" id="paste-btn" class="btn btn-ghost">Paste</button>
        <button type="submit" id="continue-btn" class="btn btn-primary">Continue</button>
      </div>
      <div id="ca-error" class="ca-error" role="alert"></div>
    </form>

    <div class="gate-foot">
      <span>Tip: you can also use</span>
      <code>?ca=ADDRESS</code> <span>or</span> <code>#ADDRESS</code>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
(function(){
  // If a CA is already in URL, jump straight to landing
  var qs = new URLSearchParams(location.search);
  var ca = qs.get('ca') || (location.hash || '').replace(/^#/,'');
  if (ca && ca.length >= 32) { location.replace('landing.html?ca=' + encodeURIComponent(ca)); return; }

  var form = document.getElementById('ca-form');
  var input = document.getElementById('ca-input');
  var err = document.getElementById('ca-error');
  var paste = document.getElementById('paste-btn');

  function validate(v){ return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(v.trim()); }

  paste.addEventListener('click', async function(){
    try { input.value = (await navigator.clipboard.readText()).trim(); err.textContent=''; }
    catch(e){ err.textContent = 'Clipboard blocked — paste manually.'; }
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var v = input.value.trim();
    if (!validate(v)) { err.textContent = 'That doesn\'t look like a valid Solana address.'; input.focus(); return; }
    location.href = 'landing.html?ca=' + encodeURIComponent(v);
  });
})();
</script>
</body>
</html>
